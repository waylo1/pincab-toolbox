# Fait respecter ADR-005 mécaniquement : un pack ne peut pas invoquer une action absente
# du registre compilé, et la CI le prouve à chaque commit.
name: knowledge-pack

on:
  push:
    paths: ["knowledge/**", "src/PincabToolbox.Repair/**", ".github/workflows/knowledge-pack.yml"]
  pull_request:
    paths: ["knowledge/**", "src/PincabToolbox.Repair/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Schema JSON
        run: |
          python -m pip install --quiet jsonschema
          python -c "
          import json, jsonschema, glob
          schema = json.load(open('knowledge/knowledge-pack.schema.json'))
          for p in glob.glob('knowledge/pack-*.json'):
              jsonschema.validate(json.load(open(p)), schema); print('ok', p)
          "

      - name: Regles metier + ADR-005 + couverture editoriale
        run: |
          for pack in knowledge/pack-*.json; do
            python knowledge/validate_pack.py "$pack" --registry src/PincabToolbox.Repair \
              --knowledge-cs src/PincabToolbox.App/Knowledge.cs
          done

      - name: Garde-fous du validateur
        working-directory: knowledge
        run: python selftest.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Core
        run: |
          python3 tests/fixtures/make_fixtures.py
          dotnet run --project tests/PincabToolbox.Core.Tests -c Release
      - name: Repair
        run: dotnet run --project tests/PincabToolbox.Repair.Tests -c Release

name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate fixtures
        run: python3 tests/fixtures/make_fixtures.py
      - name: Run Core tests
        run: dotnet run --project tests/PincabToolbox.Core.Tests -c Release
      - name: Run Repair tests
        run: dotnet run --project tests/PincabToolbox.Repair.Tests -c Release

  build-windows:
    runs-on: windows-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: >
          dotnet publish src/PincabToolbox.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:RestoreSources=https://api.nuget.org/v3/index.json
          -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: PincabToolbox-win-x64
          path: publish/
